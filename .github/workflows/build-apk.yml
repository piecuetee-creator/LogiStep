name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web application
        run: npm run build

      - name: Stage web distribution into Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew || true

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Sync APK binaries to repository apk directory
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/*.apk apk/LogiStep.apk || true
          cp android/app/build/outputs/apk/release/*.apk apk/app-release.apk || true
          cp android/app/build/outputs/apk/release/*.apk apk/logistep.apk || true
          cp android/app/build/outputs/apk/debug/*.apk apk/app-debug.apk || true
          cp apk/LogiStep.apk LogiStep.apk || true

      - name: Commit updated APKs to repository
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/*.apk LogiStep.apk
          git diff --staged --quiet || (git commit -m "Auto-update compiled Android APKs [skip ci]" && git push origin HEAD:${{ github.ref_name }})
        continue-on-error: true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LogiStep-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LogiStep-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
