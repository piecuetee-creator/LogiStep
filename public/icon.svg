<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle / icon canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="6" opacity="0.6" />

  <!-- Radar / Presence Wave Rings -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="230" r="125" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.25" />
  <circle cx="256" cy="230" r="85" fill="none" stroke="#10b981" stroke-width="3" opacity="0.35" />

  <!-- Modern Truck Body (Stylized Flat Telematics Vehicle) -->
  <g transform="translate(136, 175)">
    <!-- Truck Trailer/Cabin Container -->
    <rect x="10" y="30" width="130" height="90" rx="10" fill="url(#amberGrad)" filter="url(#glow)" />
    <!-- Cabin Cab -->
    <path d="M142 60 L185 60 C195 60 205 70 210 82 L220 102 C223 107 225 113 225 120 L225 120 L142 120 Z" fill="#f59e0b" />
    <!-- Cab Window -->
    <path d="M152 68 L180 68 C185 68 190 73 194 80 L200 92 L152 92 Z" fill="#0f172a" />
    <!-- Wheels -->
    <circle cx="50" cy="122" r="22" fill="#020617" stroke="#f59e0b" stroke-width="6" />
    <circle cx="50" cy="122" r="8" fill="#e2e8f0" />
    <circle cx="110" cy="122" r="22" fill="#020617" stroke="#f59e0b" stroke-width="6" />
    <circle cx="110" cy="122" r="8" fill="#e2e8f0" />
    <circle cx="185" cy="122" r="22" fill="#020617" stroke="#f59e0b" stroke-width="6" />
    <circle cx="185" cy="122" r="8" fill="#e2e8f0" />

    <!-- Container Step Lines (10-Step Symbolism) -->
    <line x1="30" y1="48" x2="120" y2="48" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="62" x2="120" y2="62" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="76" x2="120" y2="76" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="90" x2="120" y2="90" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- GPS Pin / Presence Pulse Above Truck -->
  <g transform="translate(256, 125)">
    <circle cx="0" cy="0" r="24" fill="url(#emeraldGrad)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
    <!-- Pulse Waves -->
    <path d="M-38 -15 A42 42 0 0 1 38 -15" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <path d="M-54 -28 A60 60 0 0 1 54 -28" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- LogiStep Title & 99002 Presence Badge -->
  <text x="256" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">LOGISTEP</text>
  <rect x="156" y="405" width="200" height="36" rx="18" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="2" />
  <text x="256" y="429" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="18" fill="#34d399" text-anchor="middle" letter-spacing="1">SERIES 99002</text>
</svg>
